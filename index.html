<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hevel</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #FFFFFF;
      color: #1A1A1A;
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      overflow: hidden;
    }

    .page {
      height: 100vh;
      width: 100vw;
      padding: 3.5rem 4rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr auto;
    }

    .top-left {
      grid-column: 1;
      grid-row: 1;
    }

    .top-right {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      justify-content: flex-end;
    }

    .location {
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      color: #1A1A1A;
    }

    .middle {
      grid-column: 1 / 3;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .copy-block {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      max-width: 560px;
      text-align: left;
    }

    .tagline {
      font-size: 0.85rem;
      font-weight: 300;
      color: #1A1A1A;
      line-height: 1.8;
      letter-spacing: 0.01em;
    }

    .bottom-left {
      grid-column: 1;
      grid-row: 3;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .wordmark {
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #1A1A1A;
      line-height: 1;
    }

    .bottom-right {
      grid-column: 2;
      grid-row: 3;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
    }

    .contact-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
    }

    .contact-label {
      font-size: 0.72rem;
      font-weight: 300;
      color: #1A1A1A;
      letter-spacing: 0.02em;
    }

    .contact-email {
      font-size: 0.72rem;
      font-weight: 300;
      color: #1A1A1A;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: #ccc;
      letter-spacing: 0.02em;
      transition: text-decoration-color 0.3s ease;
    }

    .contact-email:hover {
      text-decoration-color: #1A1A1A;
    }

    @media (max-width: 768px) {
      html, body { overflow: auto; }
      .page {
        height: auto;
        min-height: 100vh;
        padding: 2.5rem 2rem;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto auto;
      }
      .top-right { grid-column: 1; grid-row: 1; justify-content: flex-start; margin-bottom: 3rem; }
      .top-left { display: none; }
      .middle { grid-column: 1; grid-row: 2; justify-content: flex-start; margin-bottom: 2rem; }
      .bottom-left { grid-column: 1; grid-row: 3; margin-bottom: 2rem; }
      .bottom-right { grid-column: 1; grid-row: 4; align-items: flex-start; }
      .contact-block { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="top-left"></div>

    <div class="top-right">
      <span class="location">London</span>
    </div>

    <div class="middle">
      <div class="copy-block">
        <p class="tagline">Uninterested in connecting dots, but rather building worlds around individuals. Hevel refuses to de-centre community, culture, and expression.</p>
      </div>
    </div>

    <div class="bottom-left">
      <div class="wordmark">HEVEL</div>
    </div>

    <div class="bottom-right">
      <div class="contact-block">
        <span class="contact-label">Get in touch</span>
        <a class="contact-email" href="mailto:hello@hevel.fyi">hello@hevel.fyi</a>
      </div>
    </div>

  </div>
</body>
</html>
